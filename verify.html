<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

.error{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:36px;
    color:#d32f2f;
    font-weight:bold;
}
</style>
</head>
<body>

<script>
const id = new URLSearchParams(window.location.search).get("id");

fetch("students.json")
.then(res => res.json())
.then(data => {

    const student = data.find(s => s.id === id);

    if(student){
        document.body.innerHTML =
        `<iframe src="${student.pdf}"></iframe>`;
    }else{
        document.body.innerHTML =
        `<div class="error">Invalid Certificate</div>`;
    }

})
.catch(()=>{
    document.body.innerHTML =
    `<div class="error">Unable to Verify Certificate</div>`;
});
</script>

</body>
</html>
