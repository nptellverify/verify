<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Certificate Verification</title>
</head>
<body>

<script>
const id = new URLSearchParams(window.location.search).get("id");

fetch("students.json")
.then(res => res.json())
.then(data => {

    const student = data.find(s => s.id === id);

    if (!student) {
        document.body.innerHTML = "<h2>Certificate Not Found</h2>";
        return;
    }

    // Open PDF in the same browser window
    window.location.replace(student.pdf);

});
</script>

</body>
</html>
